name: asam
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - einops==0.8.2
      - numpy==1.24.4
      - pandas==2.2.1
      - scipy==1.13.0
      - scikit-learn==1.4.2
      - tqdm==4.66.4
# mamba-ssm and causal-conv1d need the installed torch and CUDA at build time; install them afterwards:
#   conda activate asam
#   pip install causal-conv1d==1.2.0.post2 mamba-ssm==2.2.2 --no-build-isolation
